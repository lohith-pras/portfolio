<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>City Descent — Spike</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; color: #cfefff; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  /* tall scroll track drives progress */
  #track { height: 600vh; }
  #stage { position: fixed; inset: 0; z-index: 0; }
  canvas { display: block; }

  /* HUD / title overlay */
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #caret {
    position: absolute; bottom: 9vh; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .35em; text-transform: uppercase; opacity: .85;
  }
  #title {
    position: absolute; bottom: 18vh; left: 6vw; transform-origin: left bottom; opacity: 0;
  }
  #title h1 { font-size: clamp(28px, 6vw, 72px); font-weight: 700; letter-spacing: -.02em; color: #eaffff; line-height: 1; }
  #title p { margin-top: .8em; font-size: clamp(11px, 1.4vw, 15px); letter-spacing: .25em; text-transform: uppercase; color: #8fd6e6; }

  /* debug readout */
  #dbg {
    position: fixed; top: 10px; left: 10px; z-index: 20; font-size: 11px; line-height: 1.5;
    background: rgba(0,20,28,.55); border: 1px solid #0a3a44; padding: 8px 10px; border-radius: 6px;
    pointer-events: none; white-space: pre; color: #7fe9ff;
  }
  #skip {
    position: fixed; bottom: 16px; right: 16px; z-index: 30; pointer-events: auto;
    font: inherit; font-size: 11px; letter-spacing: .25em; text-transform: uppercase;
    background: none; border: 1px solid #0a3a44; color: #7fe9ff; padding: 6px 10px; border-radius: 6px; cursor: pointer; opacity: .7;
  }
  #skip:hover { opacity: 1; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud">
    <div id="caret">Scroll to enter ↓</div>
    <div id="title">
      <h1>Lohith Tarikere Prasanna</h1>
      <p>Electromobility · Artificial Intelligence · Connectivity</p>
    </div>
  </div>
  <div id="dbg">booting…</div>
  <button id="skip">Skip ↓</button>
  <div id="track"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three'

// ---------------------------------------------------------------------------
// Phase windows (mirror docs plan phases.ts)
// ---------------------------------------------------------------------------
const PHASE = {
  porthole: [0.00, 0.10],
  enter:    [0.10, 0.28],
  clouds:   [0.28, 0.50],
  reveal:   [0.50, 0.65],
  beat1:    [0.65, 0.77], // Connectivity
  beat2:    [0.77, 0.89], // AI
  beat3:    [0.89, 1.00], // Electromobility
}
const REVEAL_END = 0.62
const clamp01 = (x) => Math.min(1, Math.max(0, x))
const lerp = (a, b, t) => a + (b - a) * t
const smooth = (t) => t * t * (3 - 2 * t)
function envelope(p, [s, e], fade) {
  if (p <= s || p >= e) return 0
  return Math.min(clamp01((p - s) / fade), clamp01((e - p) / fade))
}
function local(p, [s, e]) { return clamp01((p - s) / (e - s)) }

// seeded rng
function mulberry32(seed) {
  let a = seed >>> 0
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
}
const range = (r, a, b) => a + r() * (b - a)

const CYAN = new THREE.Color(0x00f5ff)
const ICE = new THREE.Color(0x99ffff)

// ---------------------------------------------------------------------------
// Camera path (mirror plan cameraPath.ts)
// ---------------------------------------------------------------------------
const KEYS = [
  { p: PHASE.porthole[0], pos: [0, 0, 14],  look: [0, 0, 0] },
  { p: PHASE.enter[1],    pos: [0, 4, 4],   look: [0, 0, -20] },
  { p: PHASE.clouds[1],   pos: [0, 30, 0],  look: [0, 0, -30] },
  { p: PHASE.reveal[1],   pos: [0, 22, 34], look: [0, 0, 0] },
  { p: PHASE.beat1[1],    pos: [-14, 6, 18],look: [0, 1, 0] },
  { p: PHASE.beat2[1],    pos: [10, 26, 20],look: [0, 8, 0] },
  { p: PHASE.beat3[1],    pos: [18, 9, -6], look: [10, 1, -10] },
]
const l3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]
function sampleCamera(p) {
  const x = clamp01(p)
  let i = 0
  while (i < KEYS.length - 1 && x > KEYS[i + 1].p) i++
  const a = KEYS[i], b = KEYS[Math.min(i + 1, KEYS.length - 1)]
  const t = smooth(clamp01((x - a.p) / ((b.p - a.p) || 1)))
  return { position: l3(a.pos, b.pos, t), lookAt: l3(a.look, b.look, t) }
}

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const stage = document.getElementById('stage')
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5))
renderer.setSize(innerWidth, innerHeight)
stage.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.fog = new THREE.FogExp2(0x000000, 0.012)
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400)

// ---------------------------------------------------------------------------
// City data (seeded grid)
// ---------------------------------------------------------------------------
function buildCity(seed) {
  const r = mulberry32(seed)
  const blocks = 8, cell = 8, half = (blocks * cell) / 2
  const lines = []
  for (let i = 0; i <= blocks; i++) lines.push(-half + i * cell)
  const buildings = []
  for (let bx = 0; bx < blocks; bx++) for (let bz = 0; bz < blocks; bz++) {
    if (r() < 0.18) continue
    buildings.push({
      x: -half + bx * cell + cell / 2, z: -half + bz * cell + cell / 2,
      w: range(r, cell * 0.4, cell * 0.7), d: range(r, cell * 0.4, cell * 0.7), h: range(r, 2, 12),
    })
  }
  const chargers = []
  for (let i = 0; i < 6; i++) chargers.push({ x: range(r, -half, half), z: range(r, -half, half) })
  return { half, cell, buildings, lines, chargers }
}
const city = buildCity(0xC17)

// ---- Porthole ----
const porthole = new THREE.Group()
{
  const ringMat = new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
  porthole.userData.ringMat = ringMat
  porthole.add(new THREE.Mesh(new THREE.TorusGeometry(3, 0.08, 12, 64), ringMat))
  porthole.add(new THREE.Mesh(new THREE.TorusGeometry(2.7, 0.02, 8, 64),
    new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false })))
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2
    const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8),
      new THREE.MeshBasicMaterial({ color: ICE, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }))
    bolt.position.set(Math.cos(a) * 3.2, Math.sin(a) * 3.2, 0)
    porthole.add(bolt)
  }
}
scene.add(porthole)

// ---- Clouds ----
function cloudTexture() {
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s
  const x = c.getContext('2d')
  const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2)
  g.addColorStop(0, 'rgba(220,240,255,0.9)'); g.addColorStop(0.4, 'rgba(160,200,230,0.4)'); g.addColorStop(1, 'rgba(120,160,200,0)')
  x.fillStyle = g; x.fillRect(0, 0, s, s)
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t
}
const clouds = new THREE.Group()
{
  const tex = cloudTexture()
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.5 })
  clouds.userData.mat = mat
  const r = mulberry32(0xC10D)
  for (let i = 0; i < 60; i++) {
    const sp = new THREE.Sprite(mat)
    sp.position.set(range(r, -30, 30), range(r, 6, 26), range(r, -30, 30))
    const sc = range(r, 8, 20); sp.scale.set(sc, sc, 1)
    clouds.add(sp)
  }
}
scene.add(clouds)

// ---- City wireframe ----
const cityGroup = new THREE.Group(); cityGroup.visible = false
{
  // roads
  const rp = []
  for (const z of city.lines) rp.push(-city.half, 0.01, z, city.half, 0.01, z)
  for (const x of city.lines) rp.push(x, 0.01, -city.half, x, 0.01, city.half)
  const rgeo = new THREE.BufferGeometry(); rgeo.setAttribute('position', new THREE.Float32BufferAttribute(rp, 3))
  const roadMat = new THREE.LineBasicMaterial({ color: CYAN, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
  cityGroup.add(new THREE.LineSegments(rgeo, roadMat))
  // buildings (merged box edges)
  const merged = []
  const box = new THREE.BoxGeometry(1, 1, 1); const edges = new THREE.EdgesGeometry(box)
  const arr = edges.attributes.position.array
  for (const b of city.buildings) for (let i = 0; i < arr.length; i += 3)
    merged.push(arr[i]*b.w + b.x, (arr[i+1]+0.5)*b.h, arr[i+2]*b.d + b.z)
  const bgeo = new THREE.BufferGeometry(); bgeo.setAttribute('position', new THREE.Float32BufferAttribute(merged, 3))
  const bMat = new THREE.LineBasicMaterial({ color: CYAN, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
  cityGroup.add(new THREE.LineSegments(bgeo, bMat))
  cityGroup.userData.mats = [roadMat, bMat]
}
scene.add(cityGroup)

// ---- Lanes + Vehicles ----
const lanes = []
for (const z of city.lines) lanes.push({ from: [-city.half, 0, z], to: [city.half, 0, z] })
for (const x of city.lines) lanes.push({ from: [x, 0, -city.half], to: [x, 0, city.half] })
const sampleLane = (lane, t) => { const u = t - Math.floor(t); return [lerp(lane.from[0], lane.to[0], u), 0, lerp(lane.from[2], lane.to[2], u)] }

const VCOUNT = matchMedia('(max-width:768px)').matches ? 12 : 40
const vehicles = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.25, 1.0),
  new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }), VCOUNT)
vehicles.visible = false
const vAgents = []
{ const r = mulberry32(0x5EED); for (let i = 0; i < VCOUNT; i++) vAgents.push({ lane: Math.floor(range(r,0,lanes.length)), t: r(), speed: range(r,0.02,0.06)*(r()<0.5?1:-1) }) }
scene.add(vehicles)

// ---- Drones ----
const DCOUNT = matchMedia('(max-width:768px)').matches ? 4 : 10
const drones = new THREE.InstancedMesh(new THREE.OctahedronGeometry(0.35, 0),
  new THREE.MeshBasicMaterial({ color: ICE, wireframe: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }), DCOUNT)
drones.visible = false
const arcs = []
{ const r = mulberry32(0xD2017); for (let i=0;i<DCOUNT;i++) arcs.push({ a:[range(r,-city.half,city.half),0,range(r,-city.half,city.half)], b:[range(r,-city.half,city.half),0,range(r,-city.half,city.half)], h: range(r,6,14), t:r(), speed:range(r,0.05,0.12) }) }
const sampleArc = (arc, t) => { const u=t-Math.floor(t); return [lerp(arc.a[0],arc.b[0],u), 4*arc.h*u*(1-u), lerp(arc.a[2],arc.b[2],u)] }
scene.add(drones)

// ---- Beat 1: V2X links ----
const linkGroup = new THREE.Group(); linkGroup.visible = false
{
  const r = mulberry32(0x71)
  const nodes = []
  for (const x of city.lines) for (const z of city.lines) nodes.push(new THREE.Vector3(x, 0.5, z))
  const pts = []
  for (let i = 0; i < 40; i++) {
    const a = nodes[Math.floor(range(r,0,nodes.length))], b = nodes[Math.floor(range(r,0,nodes.length))]
    if (a !== b && a.distanceTo(b) < city.cell * 2.2) pts.push(a.x,a.y,a.z, b.x,b.y,b.z)
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3))
  const mat = new THREE.LineBasicMaterial({ color: CYAN, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
  linkGroup.userData.mat = mat
  linkGroup.add(new THREE.LineSegments(geo, mat))
}
scene.add(linkGroup)

// ---- Beat 2: neural plane ----
const neural = new THREE.Group(); neural.visible = false
const NEURAL_Y = 16
{
  const r = mulberry32(0xA1)
  const nodes = Array.from({length:24}, () => new THREE.Vector3(range(r,-city.half,city.half), 0, range(r,-city.half,city.half)))
  const pts = []
  nodes.forEach(a => nodes.forEach(b => { if (a!==b && a.distanceTo(b) < city.cell*2) pts.push(a.x,a.y,a.z, b.x,b.y,b.z) }))
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3))
  const mat = new THREE.LineBasicMaterial({ color: ICE, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
  neural.userData.mat = mat
  neural.add(new THREE.LineSegments(geo, mat))
}
scene.add(neural)

// ---- Beat 3: energy ----
const energy = new THREE.Points(new THREE.BufferGeometry(),
  new THREE.PointsMaterial({ color: CYAN, size: 0.35, sizeAttenuation: true, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }))
energy.visible = false
{
  const pts = []
  city.chargers.forEach(c => { for (let i=0;i<20;i++) pts.push(c.x, i*0.25, c.z) })
  energy.geometry.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3))
  energy.geometry.userData.base = pts.slice()
}
scene.add(energy)

// ---------------------------------------------------------------------------
// Input: scroll progress + mouse parallax
// ---------------------------------------------------------------------------
let progress = 0
// Dev override: ?p=0.83 locks progress for screenshotting a single phase.
const pLock = new URLSearchParams(location.search).get('p')
const LOCK = pLock === null ? null : clamp01(parseFloat(pLock))
function readScroll() {
  if (LOCK !== null) { progress = LOCK; return }
  const max = document.body.scrollHeight - innerHeight
  progress = max > 0 ? clamp01(scrollY / max) : 0
}
addEventListener('scroll', readScroll, { passive: true })
readScroll()

const mouse = new THREE.Vector2(), mLerp = new THREE.Vector2()
addEventListener('pointermove', (e) => { mouse.set((e.clientX/innerWidth)*2-1, -((e.clientY/innerHeight)*2-1)) })

document.getElementById('skip').onclick = () => scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

// ---------------------------------------------------------------------------
// HUD update
// ---------------------------------------------------------------------------
const elCaret = document.getElementById('caret')
const elTitle = document.getElementById('title')
const elDbg = document.getElementById('dbg')
function phaseName(p) {
  for (const [k, w] of Object.entries(PHASE)) if (p >= w[0] && p < w[1]) return k
  return 'beat3'
}
function updateHUD(p) {
  elCaret.style.opacity = String(Math.max(0, 1 - p / PHASE.porthole[1]))
  const appear = clamp01((p - PHASE.reveal[0]) / (REVEAL_END - PHASE.reveal[0]))
  const dock = clamp01((p - PHASE.beat1[0]) / (PHASE.beat1[1] - PHASE.beat1[0]))
  elTitle.style.opacity = String(appear)
  elTitle.style.transform = `translate(${dock*-2}vw, ${dock*4}vh) scale(${1 - dock*0.45})`
  elDbg.textContent = `progress ${p.toFixed(3)}  phase ${phaseName(p)}\nvehicles ${VCOUNT}  drones ${DCOUNT}`
}

// ---------------------------------------------------------------------------
// Animation
// ---------------------------------------------------------------------------
const dummy = new THREE.Object3D()
const lookT = new THREE.Vector3()
const clock = new THREE.Clock()

function frame() {
  const t = clock.getElapsedTime()
  const dt = Math.min(clock.getDelta(), 0.05)
  const p = progress

  // camera
  const pose = sampleCamera(p)
  mLerp.lerp(mouse, 0.05)
  camera.position.set(pose.position[0] + Math.sin(t*0.13)*0.6 + mLerp.x*2.2,
                      pose.position[1] + Math.cos(t*0.11)*0.4 + mLerp.y*1.4,
                      pose.position[2])
  lookT.set(pose.lookAt[0], pose.lookAt[1], pose.lookAt[2]); camera.lookAt(lookT)

  // porthole
  const pv = (p < PHASE.porthole[0] + 0.001) ? 1 : envelope(p, [PHASE.porthole[0], PHASE.enter[1]], 0.04)
  porthole.visible = pv > 0.001
  if (porthole.visible) {
    const e = local(p, PHASE.enter)
    porthole.scale.setScalar(1 + e * 6)
    porthole.userData.ringMat.opacity = pv * (0.9 + 0.1 * Math.sin(t * 1.5))
  }

  // clouds
  const cv = envelope(p, PHASE.clouds, 0.06)
  clouds.visible = cv > 0.001
  clouds.userData.mat.opacity = 0.6 * cv

  // city
  cityGroup.visible = p >= PHASE.reveal[0] - 0.02
  if (cityGroup.visible) { const draw = local(p, [PHASE.reveal[0], PHASE.reveal[1]]); cityGroup.userData.mats.forEach(m => m.opacity = draw) }

  // vehicles
  const cityActive = p >= PHASE.reveal[0]
  vehicles.visible = cityActive
  if (cityActive) {
    vAgents.forEach((a, i) => { a.t += a.speed * dt; const pt = sampleLane(lanes[a.lane], a.t); dummy.position.set(pt[0], 0.3, pt[2]); dummy.rotation.set(0,0,0); dummy.updateMatrix(); vehicles.setMatrixAt(i, dummy.matrix) })
    vehicles.instanceMatrix.needsUpdate = true
  }

  // drones
  drones.visible = cityActive
  if (cityActive) {
    arcs.forEach((a, i) => { a.t += a.speed * dt; const pt = sampleArc(a, a.t); dummy.position.set(pt[0], pt[1], pt[2]); dummy.rotation.y += dt*2; dummy.updateMatrix(); drones.setMatrixAt(i, dummy.matrix) })
    drones.instanceMatrix.needsUpdate = true
  }

  // beat 1 links
  const v1 = envelope(p, PHASE.beat1, 0.03)
  linkGroup.visible = v1 > 0.001
  linkGroup.userData.mat.opacity = v1 * (0.5 + 0.5 * Math.sin(t * 3))

  // beat 2 neural
  const v2 = envelope(p, PHASE.beat2, 0.04)
  neural.visible = v2 > 0.001
  if (neural.visible) { neural.position.y = NEURAL_Y * (0.6 + 0.4 * local(p, PHASE.beat2)); neural.userData.mat.opacity = v2 * 0.8 }

  // beat 3 energy — animate points upward
  const v3 = envelope(p, PHASE.beat3, 0.04)
  energy.visible = v3 > 0.001
  if (energy.visible) {
    const pos = energy.geometry.attributes.position, base = energy.geometry.userData.base
    for (let i = 1; i < pos.count * 3; i += 3) pos.array[i] = ((base[i] + t * 2) % 5)
    pos.needsUpdate = true
    energy.material.opacity = v3 * (0.6 + 0.4 * Math.sin(t * 4))
  }

  updateHUD(p)
  renderer.render(scene, camera)
  requestAnimationFrame(frame)
}
frame()
</script>
</body>
</html>
